<svg viewBox="0 0 1050 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="720" fill="#f5f5f5"/>
  <text x="20" y="25" font-size="14" fill="#888">Screen 5 — Maintenance Tasks (two role views shown side by side)</text>

  <!-- MANAGER VIEW -->
  <text x="30" y="55" font-size="13" font-weight="bold" fill="#222">Manager view — all tasks</text>
  <rect x="30" y="65" width="480" height="600" fill="#fff" stroke="#ccc" rx="3"/>
  <rect x="30" y="65" width="480" height="28" fill="#eee"/>
  <text x="40" y="83" font-size="9" font-weight="bold" fill="#555">Description</text>
  <text x="180" y="83" font-size="9" font-weight="bold" fill="#555">Incident/Machine</text>
  <text x="300" y="83" font-size="9" font-weight="bold" fill="#555">Assignee</text>
  <text x="380" y="83" font-size="9" font-weight="bold" fill="#555">Status</text>
  <text x="450" y="83" font-size="9" font-weight="bold" fill="#555">Created</text>

  <!-- rows -->
  <g font-size="9" fill="#333">
    <text x="40" y="112">Inspect bearing assembly</text>
    <text x="180" y="112">Machine A</text>
    <text x="300" y="112">tech_1</text>
    <rect x="378" y="100" width="55" height="18" fill="#eee" stroke="#999" rx="9"/>
    <text x="405" y="112" text-anchor="middle">To Do</text>
    <text x="450" y="112">2d ago</text>
    <line x1="30" y1="122" x2="510" y2="122" stroke="#eee"/>

    <text x="40" y="142">Replace vibration sensor</text>
    <text x="180" y="142">Machine C</text>
    <text x="300" y="142">tech_2</text>
    <rect x="378" y="130" width="55" height="18" fill="#d0a000" rx="9"/>
    <text x="405" y="142" text-anchor="middle" fill="#fff">Doing</text>
    <text x="450" y="142">1d ago</text>
    <line x1="30" y1="152" x2="510" y2="152" stroke="#eee"/>

    <text x="40" y="172">Lubricate main shaft</text>
    <text x="180" y="172">Machine A</text>
    <text x="300" y="172">tech_1</text>
    <rect x="378" y="160" width="55" height="18" fill="#2e7d32" rx="9"/>
    <text x="405" y="172" text-anchor="middle" fill="#fff">Done</text>
    <text x="450" y="172">4d ago</text>
  </g>

  <!-- Create/assign panel -->
  <rect x="45" y="195" width="450" height="130" fill="#f0f6ff" stroke="#8fb8e8" stroke-dasharray="3,2" rx="3"/>
  <text x="55" y="215" font-size="10" font-weight="bold" fill="#2b6cb0">Create task (typically from an incident)</text>
  <text x="55" y="235" font-size="9" fill="#555">Description</text>
  <rect x="55" y="240" width="420" height="24" fill="#fff" stroke="#bbb" rx="3"/>
  <text x="55" y="280" font-size="9" fill="#555">Assign to</text>
  <rect x="55" y="285" width="200" height="24" fill="#fff" stroke="#bbb" rx="3"/>
  <text x="65" y="301" font-size="8" fill="#999">Select technician ▾</text>
  <rect x="365" y="285" width="110" height="26" fill="#2b6cb0" rx="4"/>
  <text x="420" y="302" font-size="9" text-anchor="middle" fill="#fff">Create Task</text>

  <text x="45" y="345" font-size="8" fill="#999" font-style="italic">No calendar/due-date view — status + timestamps only.</text>

  <!-- TECHNICIAN VIEW -->
  <text x="560" y="55" font-size="13" font-weight="bold" fill="#222">Technician view — assigned to me only</text>
  <rect x="560" y="65" width="460" height="300" fill="#fff" stroke="#ccc" rx="3"/>
  <rect x="560" y="65" width="460" height="28" fill="#eee"/>
  <text x="570" y="83" font-size="9" font-weight="bold" fill="#555">Description</text>
  <text x="750" y="83" font-size="9" font-weight="bold" fill="#555">Machine</text>
  <text x="850" y="83" font-size="9" font-weight="bold" fill="#555">Status</text>

  <g font-size="9" fill="#333">
    <text x="570" y="112">Inspect bearing assembly</text>
    <text x="750" y="112">Machine A</text>
    <rect x="845" y="100" width="90" height="20" fill="#eee" stroke="#999" rx="3"/>
    <text x="890" y="114" text-anchor="middle" font-size="8">To Do ▾</text>
    <line x1="560" y1="122" x2="1020" y2="122" stroke="#eee"/>

    <text x="570" y="142">Lubricate main shaft</text>
    <text x="750" y="142">Machine A</text>
    <rect x="845" y="130" width="90" height="20" fill="#2e7d32" rx="3"/>
    <text x="890" y="144" text-anchor="middle" font-size="8" fill="#fff">Done ▾</text>
  </g>

  <rect x="575" y="390" width="430" height="55" fill="#fff8e1" stroke="#e0c060" rx="3"/>
  <text x="585" y="410" font-size="9" font-weight="bold" fill="#8a6d00">Access rule:</text>
  <text x="585" y="425" font-size="9" fill="#8a6d00">Technician sees/edits only own assigned tasks.</text>
  <text x="585" y="438" font-size="9" fill="#8a6d00">Cannot view or modify other technicians' tasks.</text>

  <text x="20" y="700" font-size="11" fill="#888">Status flows: Manager assigns → Technician updates To Do → Doing → Done.</text>
</svg>
