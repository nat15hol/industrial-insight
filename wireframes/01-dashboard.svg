<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#f5f5f5"/>
  <text x="20" y="25" font-size="14" fill="#888">Screen 1 — Dashboard (Overview)</text>

  <!-- Header -->
  <rect x="0" y="40" width="1000" height="55" fill="#222"/>
  <text x="20" y="73" font-size="15" font-weight="bold" fill="#fff">Industrial Insight</text>
  <text x="800" y="73" font-size="12" fill="#ccc">🔔</text>
  <rect x="830" y="55" width="60" height="24" fill="#3a3a3a" rx="10"/>
  <text x="860" y="71" font-size="10" text-anchor="middle" fill="#fff">Manager</text>
  <text x="905" y="73" font-size="12" fill="#eee">John ▾</text>

  <!-- Sidebar -->
  <rect x="0" y="95" width="180" height="605" fill="#2d2d2d"/>
  <text x="20" y="135" font-size="12" fill="#fff">■ Dashboard</text>
  <text x="20" y="170" font-size="12" fill="#bbb">Machines</text>
  <text x="20" y="205" font-size="12" fill="#bbb">Incidents</text>
  <text x="20" y="240" font-size="12" fill="#bbb">Maintenance</text>
  <text x="20" y="275" font-size="12" fill="#bbb">Pipeline</text>
  <text x="20" y="292" font-size="9" fill="#777" font-style="italic">(Manager only)</text>

  <!-- Main area -->
  <!-- Stat cards -->
  <g>
    <rect x="200" y="115" width="150" height="80" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="215" y="140" font-size="10" fill="#777">Total Machines</text>
    <text x="215" y="175" font-size="22" font-weight="bold" fill="#222">24</text>

    <rect x="365" y="115" width="150" height="80" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="380" y="140" font-size="10" fill="#777">Open Incidents</text>
    <text x="380" y="175" font-size="22" font-weight="bold" fill="#c0392b">7</text>

    <rect x="530" y="115" width="150" height="80" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="545" y="140" font-size="10" fill="#777">Avg. Resolution</text>
    <text x="545" y="175" font-size="18" font-weight="bold" fill="#222">2.4 days</text>

    <rect x="695" y="115" width="140" height="80" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="710" y="140" font-size="10" fill="#777">Latest Pipeline</text>
    <text x="710" y="175" font-size="14" font-weight="bold" fill="#2e7d32">Success</text>

    <rect x="850" y="115" width="130" height="80" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="862" y="140" font-size="10" fill="#777">Data Quality</text>
    <text x="862" y="175" font-size="18" font-weight="bold" fill="#222">96%</text>
  </g>

  <!-- Priority Score List -->
  <text x="200" y="225" font-size="13" font-weight="bold" fill="#222">Machine Priority</text>
  <text x="380" y="225" font-size="10" fill="#999" font-style="italic">rule-based, not predictive — see (i)</text>
  <circle cx="370" cy="221" r="7" fill="#e0e0e0"/>
  <text x="370" y="225" font-size="9" text-anchor="middle" fill="#555">i</text>

  <rect x="200" y="235" width="780" height="70" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="215" y="255" font-size="12" font-weight="bold" fill="#222">Machine A</text>
  <rect x="310" y="243" width="90" height="18" fill="#c0392b" rx="9"/>
  <text x="355" y="256" font-size="10" text-anchor="middle" fill="#fff">82/100 · HIGH</text>
  <text x="215" y="272" font-size="10" fill="#666">3 unresolved incidents · recurring issue</text>
  <text x="215" y="287" font-size="10" fill="#666">Recommended: Inspect bearing assembly</text>
  <rect x="820" y="258" width="150" height="30" fill="#2b6cb0" rx="4"/>
  <text x="895" y="277" font-size="10" text-anchor="middle" fill="#fff">Create maintenance task</text>

  <rect x="200" y="312" width="780" height="60" fill="#fff" stroke="#d0a000" stroke-width="1.5" rx="3"/>
  <text x="215" y="332" font-size="12" font-weight="bold" fill="#222">Machine B</text>
  <rect x="310" y="320" width="100" height="18" fill="#d0a000" rx="9"/>
  <text x="360" y="333" font-size="10" text-anchor="middle" fill="#fff">61/100 · MEDIUM</text>
  <text x="215" y="350" font-size="10" fill="#666">1 unresolved incident</text>
  <rect x="820" y="328" width="150" height="30" fill="#2b6cb0" rx="4"/>
  <text x="895" y="347" font-size="10" text-anchor="middle" fill="#fff">Create maintenance task</text>

  <!-- Recent incidents feed -->
  <text x="200" y="405" font-size="13" font-weight="bold" fill="#222">Recent Incidents</text>
  <rect x="200" y="415" width="780" height="120" fill="#fff" stroke="#ccc" rx="3"/>
  <text x="215" y="440" font-size="10" fill="#555">Machine C — Sensor fault reported — Open — 2h ago</text>
  <line x1="215" y1="452" x2="965" y2="452" stroke="#eee"/>
  <text x="215" y="470" font-size="10" fill="#555">Machine A — Vibration threshold exceeded — InProgress — 5h ago</text>
  <line x1="215" y1="482" x2="965" y2="482" stroke="#eee"/>
  <text x="215" y="500" font-size="10" fill="#555">Machine D — Routine check flagged — Resolved — 1d ago</text>

  <text x="20" y="670" font-size="11" fill="#888">Note: Priority Score badge/explanation text is a required visible element, not just docs.</text>
</svg>
