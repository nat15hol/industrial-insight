<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#f5f5f5"/>
  <text x="20" y="25" font-size="14" fill="#888">Screen 3 — Incident Reporting Form (Technician)</text>

  <!-- Header -->
  <rect x="0" y="40" width="1000" height="55" fill="#222"/>
  <text x="20" y="73" font-size="15" font-weight="bold" fill="#fff">Industrial Insight</text>

  <!-- Sidebar -->
  <rect x="0" y="95" width="180" height="605" fill="#2d2d2d"/>
  <text x="20" y="135" font-size="12" fill="#bbb">Dashboard</text>
  <text x="20" y="170" font-size="12" fill="#bbb">Machines</text>
  <text x="20" y="205" font-size="12" fill="#fff">■ Incidents</text>
  <text x="20" y="240" font-size="12" fill="#bbb">Maintenance</text>

  <!-- Form card -->
  <rect x="250" y="120" width="500" height="500" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="270" y="150" font-size="15" font-weight="bold" fill="#222">Report Incident</text>

  <text x="270" y="180" font-size="11" fill="#555">Machine *</text>
  <rect x="270" y="188" width="460" height="32" fill="#fafafa" stroke="#bbb" rx="3"/>
  <text x="285" y="209" font-size="10" fill="#888">Select machine ▾</text>

  <text x="270" y="240" font-size="11" fill="#555">Description *</text>
  <rect x="270" y="248" width="460" height="90" fill="#fafafa" stroke="#bbb" rx="3"/>
  <text x="285" y="266" font-size="10" fill="#aaa">Describe the incident...</text>

  <!-- AI suggestion trigger -->
  <rect x="270" y="352" width="160" height="30" fill="#fff" stroke="#2b6cb0" rx="4"/>
  <text x="350" y="371" font-size="10" text-anchor="middle" fill="#2b6cb0">Get AI suggestion</text>
  <text x="440" y="371" font-size="9" fill="#999" font-style="italic">optional, if AI enabled</text>

  <!-- AI suggestion editable preview block -->
  <rect x="270" y="395" width="460" height="140" fill="#f0f6ff" stroke="#8fb8e8" stroke-dasharray="4,2" rx="4"/>
  <text x="285" y="415" font-size="10" font-weight="bold" fill="#2b6cb0">AI Suggestion (editable preview)</text>
  <text x="285" y="433" font-size="9" fill="#555">Category:</text>
  <rect x="345" y="422" width="150" height="18" fill="#fff" stroke="#bbb" rx="2"/>
  <text x="285" y="455" font-size="9" fill="#555">Priority:</text>
  <rect x="345" y="444" width="90" height="18" fill="#fff" stroke="#bbb" rx="2"/>
  <text x="285" y="477" font-size="9" fill="#555">Recommended Action:</text>
  <rect x="285" y="483" width="425" height="18" fill="#fff" stroke="#bbb" rx="2"/>
  <text x="285" y="518" font-size="8" fill="#777" font-style="italic">Rationale: short explanation shown here — editable, not forced</text>

  <rect x="270" y="548" width="90" height="26" fill="#eee" stroke="#999" rx="3"/>
  <text x="315" y="565" font-size="9" text-anchor="middle" fill="#555">Ignore</text>
  <rect x="370" y="548" width="90" height="26" fill="#eee" stroke="#999" rx="3"/>
  <text x="415" y="565" font-size="9" text-anchor="middle" fill="#555">Accept as-is</text>

  <!-- Submit -->
  <rect x="530" y="595" width="200" height="34" fill="#2b6cb0" rx="4"/>
  <text x="630" y="617" font-size="11" text-anchor="middle" fill="#fff">Submit Incident</text>

  <!-- Degradation note -->
  <rect x="200" y="630" width="600" height="55" fill="#fff8e1" stroke="#e0c060" rx="3"/>
  <text x="215" y="650" font-size="10" font-weight="bold" fill="#8a6d00">Graceful degradation:</text>
  <text x="215" y="666" font-size="10" fill="#8a6d00">If AI unavailable/disabled/invalid → no suggestion block shown,</text>
  <text x="215" y="680" font-size="10" fill="#8a6d00">form stays fully usable with Machine + Description only.</text>
</svg>
