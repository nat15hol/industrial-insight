<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#f5f5f5"/>

  <!-- Page label -->
  <text x="20" y="30" font-size="14" fill="#888">Screen 0 — Login / Register (unauthenticated)</text>

  <!-- Centered card, no sidebar/nav -->
  <rect x="300" y="90" width="300" height="420" fill="#ffffff" stroke="#333" stroke-width="2" rx="6"/>

  <!-- Logo / title -->
  <text x="450" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Industrial Insight</text>

  <!-- Tab toggle: Login / Register -->
  <rect x="330" y="155" width="110" height="34" fill="#333" stroke="#333" rx="4"/>
  <text x="385" y="177" font-size="13" text-anchor="middle" fill="#fff">Login</text>
  <rect x="440" y="155" width="130" height="34" fill="#fff" stroke="#999" rx="4"/>
  <text x="505" y="177" font-size="13" text-anchor="middle" fill="#555">Register</text>

  <!-- LOGIN STATE fields (Email, Password) -->
  <text x="330" y="220" font-size="12" fill="#555">Email</text>
  <rect x="330" y="228" width="240" height="34" fill="#fafafa" stroke="#bbb" rx="3"/>

  <text x="330" y="282" font-size="12" fill="#555">Password</text>
  <rect x="330" y="290" width="240" height="34" fill="#fafafa" stroke="#bbb" rx="3"/>

  <!-- Submit button -->
  <rect x="330" y="345" width="240" height="38" fill="#2b6cb0" rx="4"/>
  <text x="450" y="369" font-size="13" text-anchor="middle" fill="#fff">Log In</text>

  <!-- Divider -->
  <line x1="330" y1="400" x2="570" y2="400" stroke="#ddd" stroke-width="1"/>

  <!-- Register-only note -->
  <rect x="330" y="415" width="240" height="70" fill="#fff8e1" stroke="#e0c060" rx="3" stroke-dasharray="3,2"/>
  <text x="450" y="435" font-size="11" text-anchor="middle" fill="#8a6d00" font-style="italic">Register adds: Name field.</text>
  <text x="450" y="450" font-size="11" text-anchor="middle" fill="#8a6d00" font-style="italic">New accounts are always</text>
  <text x="450" y="465" font-size="11" text-anchor="middle" fill="#8a6d00" font-style="italic">created as Technician.</text>
  <text x="450" y="480" font-size="11" text-anchor="middle" fill="#8a6d00" font-style="italic">No self-service Manager signup.</text>

  <text x="450" y="500" font-size="11" text-anchor="middle" fill="#999">On success → redirect to Dashboard</text>

  <!-- Annotation -->
  <text x="20" y="560" font-size="12" fill="#888">Note: No sidebar or header nav on this screen (unauthenticated state).</text>
  <text x="20" y="578" font-size="12" fill="#888">See UI_Specification.md §0 for validation rules and JWT handling.</text>
</svg>
