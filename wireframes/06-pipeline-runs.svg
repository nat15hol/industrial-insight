<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="600" fill="#f5f5f5"/>
  <text x="20" y="25" font-size="14" fill="#888">Screen 6 — Pipeline Runs (Manager only)</text>

  <!-- Header -->
  <rect x="0" y="40" width="1050" height="55" fill="#222"/>
  <text x="20" y="73" font-size="15" font-weight="bold" fill="#fff">Industrial Insight</text>
  <rect x="900" y="55" width="90" height="24" fill="#3a3a3a" rx="10"/>
  <text x="945" y="71" font-size="10" text-anchor="middle" fill="#fff">Manager</text>

  <!-- Sidebar -->
  <rect x="0" y="95" width="180" height="480" fill="#2d2d2d"/>
  <text x="20" y="135" font-size="12" fill="#bbb">Dashboard</text>
  <text x="20" y="170" font-size="12" fill="#bbb">Machines</text>
  <text x="20" y="205" font-size="12" fill="#bbb">Incidents</text>
  <text x="20" y="240" font-size="12" fill="#bbb">Maintenance</text>
  <text x="20" y="275" font-size="12" fill="#fff">■ Pipeline</text>

  <text x="200" y="130" font-size="16" font-weight="bold" fill="#222">Pipeline Runs</text>
  <text x="200" y="150" font-size="10" fill="#777">Telemetry ingestion health — GET /api/pipeline/runs</text>

  <!-- Table -->
  <rect x="200" y="170" width="830" height="330" fill="#fff" stroke="#ccc" rx="3"/>
  <rect x="200" y="170" width="830" height="28" fill="#eee"/>
  <g font-size="9" font-weight="bold" fill="#555">
    <text x="212" y="188">Started At</text>
    <text x="320" y="188">Finished At</text>
    <text x="430" y="188">Processed</text>
    <text x="510" y="188">Accepted</text>
    <text x="590" y="188">Rejected</text>
    <text x="665" y="188">Duplicates</text>
    <text x="745" y="188">Quality %</text>
    <text x="830" y="188">Status</text>
  </g>

  <g font-size="9" fill="#333">
    <text x="212" y="218">2026-08-16 06:00</text>
    <text x="320" y="218">2026-08-16 06:02</text>
    <text x="440" y="218">1,204</text>
    <text x="518" y="218">1,158</text>
    <text x="598" y="218">30</text>
    <text x="675" y="218">16</text>
    <text x="750" y="218">96%</text>
    <rect x="825" y="206" width="65" height="18" fill="#2e7d32" rx="9"/>
    <text x="857" y="218" text-anchor="middle" fill="#fff">Success</text>
    <line x1="200" y1="228" x2="1030" y2="228" stroke="#eee"/>

    <text x="212" y="250">2026-08-15 06:00</text>
    <text x="320" y="250">2026-08-15 06:03</text>
    <text x="440" y="250">1,190</text>
    <text x="518" y="250">1,050</text>
    <text x="598" y="250">98</text>
    <text x="675" y="250">42</text>
    <text x="750" y="250">88%</text>
    <rect x="825" y="238" width="65" height="18" fill="#d0a000" rx="9"/>
    <text x="857" y="250" text-anchor="middle" fill="#fff">Warning</text>
    <line x1="200" y1="260" x2="1030" y2="260" stroke="#eee"/>

    <text x="212" y="282">2026-08-14 06:00</text>
    <text x="320" y="282">—</text>
    <text x="440" y="282">340</text>
    <text x="518" y="282">0</text>
    <text x="598" y="282">340</text>
    <text x="675" y="282">0</text>
    <text x="750" y="282">0%</text>
    <rect x="825" y="270" width="65" height="18" fill="#c0392b" rx="9"/>
    <text x="857" y="282" text-anchor="middle" fill="#fff">Failed</text>
  </g>

  <text x="200" y="530" font-size="11" fill="#888">Purpose: visibility into ingestion health without inspecting raw CSVs/logs directly.</text>
  <text x="200" y="548" font-size="11" fill="#888">Access: Manager only — sidebar item hidden entirely for Technician role.</text>
</svg>
